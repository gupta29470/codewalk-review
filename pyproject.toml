[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codewalk"
version = "0.1.0"
description = "MCP-only graph analysis and code review toolkit (no ChromaDB, no API, no LLM calls)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp==1.28.1",
    "duckdb==1.5.4",
    "igraph==1.0.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-php==0.24.1",
    "tree-sitter-yaml==0.7.2",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-swift==0.7.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "unidiff==0.7.5",
    "packaging==26.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/codewalk --cov-report=term-missing"
markers = [
    "slow: long-running tests (large fixture repos, real subprocess timing)",
    "integration: tests that spawn real subprocesses/multiprocessing (e.g. DuckDB lock contention)",
]

[tool.coverage.run]
source = ["src/codewalk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C90",           # mccabe complexity
    "S",             # flake8-bandit (security)
    "PTH",           # prefer pathlib over os.path
    "RUF",           # ruff-native rules
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# git subprocess calls: no shell=True, fixed "git" executable, list-based args (no injection risk).
"src/codewalk/review/diff_parser.py" = ["S603", "S607"]
"src/codewalk/review/engine.py" = ["S603", "S607"]
"src/codewalk/review/target.py" = ["S603", "S607"]
"src/codewalk/staleness.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["igraph.*", "duckdb.*", "tree_sitter.*", "tree_sitter_languages.*", "unidiff.*"]
ignore_missing_imports = true
